name: CI Pipeline

on:
  pull_request:
    types: [closed]
    branches: [dev]

jobs:
  code-quality:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install flake8 pylint
          pip install -r requirements.txt

      - name: Run flake8
        run: |
          flake8 src/ --output-file=flake8_report.txt --exit-zero
          cat flake8_report.txt

      - name: Run pylint
        run: |
          pylint src/ --output-format=text --exit-zero > pylint_report.txt 2>&1
          cat pylint_report.txt

      - name: Generate summary report
        run: |
          echo "===== ОТЧЕТ О ПРОВЕРКЕ КОДА =====" > report.txt
          echo "Дата: $(date '+%Y-%m-%d %H:%M:%S')" >> report.txt
          echo "Ветка: ${{ github.head_ref }}" >> report.txt
          echo "Автор: ${{ github.actor }}" >> report.txt
          echo "" >> report.txt
          echo "--- Flake8 ---" >> report.txt
          cat flake8_report.txt >> report.txt
          echo "" >> report.txt
          echo "--- Pylint ---" >> report.txt
          cat pylint_report.txt >> report.txt

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: report.txt

  notify:
    needs: code-quality
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Send Telegram notification
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          BRANCH="${{ github.head_ref }}"
          REPO="${{ github.repository }}"
          PR_URL="${{ github.event.pull_request.html_url }}"
          MERGE_DATE=$(date '+%Y.%m.%d %H:%M:%S')
          AUTHOR="${{ github.actor }}"

          TEXT="🔔 <b>PIPELINE ЗАВЕРШЕН</b>%0A"
          TEXT+="────────────────────%0A"
          TEXT+="📦 <b>Проект:</b> ${REPO}%0A"
          TEXT+="🌿 <b>Ветка:</b> ${BRANCH}%0A"
          TEXT+="📅 <b>Дата:</b> ${MERGE_DATE}%0A"
          TEXT+="👤 <b>Автор:</b> ${AUTHOR}%0A"
          TEXT+="────────────────────%0A"
          TEXT+="🔗 <b>Pull Request:</b> ${PR_URL}%0A"
          TEXT+="🔗 <b>Репозиторий:</b> https://github.com/${REPO}%0A"
          TEXT+="────────────────────%0A"
          TEXT+="✅ Проверка качества кода пройдена"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${TEXT}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true"
